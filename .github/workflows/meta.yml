name: Meta stats

# Every 6 hours, reads the top of the ranking from the game API and publishes
# meta.json (comps tier list and trainer stats) on the meta-data branch,
# which the app downloads. One collection for everyone keeps the load on the
# game API low. The runs seen so far stay in an Actions cache (not public),
# so each collection adds to the previous ones.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  # TEMPORARY: a run from this branch to see the API's run fields. Remove before merging.
  push:
    branches: [claude/project-thread-ly0u7b]

permissions:
  contents: write

concurrency:
  group: meta
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore the runs from earlier collections
        uses: actions/cache/restore@v4
        with:
          path: meta-state
          key: meta-state-${{ github.run_id }}
          restore-keys: meta-state-
      - run: npm run meta:collect -- meta-out meta-state/runs.json
      - name: Save the runs for the next collection
        uses: actions/cache/save@v4
        with:
          path: meta-state
          key: meta-state-${{ github.run_id }}
      - name: Publish meta.json on the meta-data branch
        working-directory: meta-out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b meta-data
          git add meta.json
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "Meta stats $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" meta-data
