name: Release

# Builds the Windows .exe and publishes it on the Releases page, tagged with
# "version" from package.json. Run it from the Actions tab (Run workflow), or
# push a tag like v0.1.0 that matches that version.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Work out the tag
        shell: pwsh
        run: |
          $tag = "v" + (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) { throw "Tag ${{ github.ref_name }} does not match package.json version $tag" }
          "TAG=$tag" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:TAG" dist/BatomonMatchHistory.exe --target "${{ github.sha }}" --title "$env:TAG" --generate-notes
