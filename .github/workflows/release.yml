name: Release

# Push a tag like v0.1.0 (matching "version" in package.json) to build the
# Windows .exe and publish it on the Releases page.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/BatomonMatchHistory.exe --title "${{ github.ref_name }}" --generate-notes
